# 提交前检查钩子。钩子仓统一走 gitcode 镜像，与 ops-math 保持一致。
#
#   pip install pre-commit && pre-commit install     # 启用
#   pre-commit run --all-files                       # 全量跑一遍
minimum_pre_commit_version: 4.0.0
exclude: ^(output|ascendc/_work)/

default_stages: [pre-commit]
ci:
  autofix_prs: false
  autoupdate_schedule: monthly

repos:
  # pre-commit 基础检查
  - repo: https://gitcode.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        exclude: \.tsv$          # manifest.tsv 以制表符分列，不要动行尾
      - id: end-of-file-fixer
        exclude: \.tsv$
      - id: check-yaml
        args: ["--allow-multiple-documents"]
      - id: check-json
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: detect-private-key
      - id: mixed-line-ending
        args: ["--fix=lf"]

  # C++ 代码格式化检查
  - repo: https://gitcode.com/pre-commit-clang/mirrors-clang-format
    rev: v18.1.8
    hooks:
      - id: clang-format
        files: \.(c|h|cpp|hpp|cc|hh|cxx|hxx)$
        args: ["--style=file", "--verbose", "-i"]

  # Python 代码检查（只报告，不自动改写，避免与既有风格产生大面积 diff）
  - repo: https://gitcode.com/gh_mirrors/ru/ruff-pre-commit
    rev: v0.14.14
    hooks:
      - id: ruff-check
        types: [python]

  # 许可证头检查
  - repo: local
    hooks:
      - id: license-header
        name: CANN license header check
        entry: bash scripts/check_license_header.sh
        language: system
        pass_filenames: true
        types: [file]
        files: \.(c|h|cpp|hpp|cc|py|sh|cmake)$|CMakeLists\.txt$
