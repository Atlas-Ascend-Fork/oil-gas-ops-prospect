name: compile_action

on:
  workflow_call:
    inputs:
      task_name:
        required: true
        type: string
      image_version:
        required: true
        type: string
      arch:
        required: false
        type: string
        default: 'x64'
      package_name:
        required: false
        type: string
        default: ''
      spec:
        required: false
        type: string
        default: 'xlarge'

jobs:
  JOB_compile:
    name: Compile
    steps:
      -
        name: Checkout
        identifier: process_checkout
        uses: checkout
        with:
          ref: ${{ atomgit.event.pull_request.merge_commit_sha }}
          allow-unsafe-pr-checkout: true
      -
        name: download
        uses: obs-download
        with:
          endpoint: "https://obs.cn-north-4.myhuaweicloud.com"
          bucket: "ascend-ci"
          access-key: ${{ secrets.AK }}
          secret-key: ${{ secrets.SK }}
          key: |
            ${{ env.obs_path }}/pr_filelist.txt
            ${{ env.obs_path }}/pr_filelist_mod.txt
            ${{ env.obs_path }}/update_file_detail.txt
          path: ${{ steps.process_checkout.outputs.path }}
      -
        name: compile_acc
        identifier: compile
        uses: build-accelerate
        with:
          command: |
            export WORKSPACE=${{ steps.process_checkout.outputs.path }}
            cd ${{ steps.process_checkout.outputs.path }}
            export task_name=${{ inputs.task_name }}
            export GIT_TARGET_BRANCH=${{ env.TARGET_BRANCH }}
            export OS_TYPE=${{ inputs.arch == 'arm64' && 'aarch64' || 'x86_64' }}
            # 注意: 不要 source devtoolset-7（GCC 7）——whl 的 pybind 扩展对接
            # torch 头文件要求 GCC>=9，镜像默认 gcc（>=15）满足；source 会遮蔽。
            source /home/jenkins/Ascend/cann/bin/setenv.bash
            # AscendC 算子包：msopgen 生成工程 -> opbuild/bisheng 编译 -> OPP .run
            BuildAccelerate bash ascendc/build.sh
          AC_SERVER_IP: ${{ vars.AC_SERVER_IP }}
      -
        name: collect_package
        if: ${{ inputs.package_name != '' }}
        run: |
          cd ${{ steps.process_checkout.outputs.path }}
          mkdir -p build_out
          find output -name '*_opp_*.run' -exec cp {} build_out/ \;
          find output -name '*.whl' -exec cp {} build_out/ \;
          cd build_out
          for f in *.run; do
            [ -f "$f" ] || continue
            [ "$f" = "${{ inputs.package_name }}" ] && continue
            mv "$f" "${{ inputs.package_name }}"
            echo "Renamed: $f -> ${{ inputs.package_name }}"
            break
          done
      -
        name: verify_package
        if: ${{ inputs.package_name != '' }}
        uses: cann/.gitcode/actions/verify-package@master
        with:
          workspace: ${{ steps.process_checkout.outputs.path }}
          package_type: run
      -
        name: upload
        uses: obs-upload
        with:
          endpoint: "https://obs.cn-north-4.myhuaweicloud.com"
          bucket: "ascend-ci"
          access-key: ${{ secrets.AK }}
          secret-key: ${{ secrets.SK }}
          artifact-path: |
            ${{ steps.process_checkout.outputs.path }}/build_out/*.*
          object-prefix: ${{ env.obs_path }}/
    if: "${{ default() }}"
    runs-on:
      - self-hosted
      - arch=${{ inputs.arch }}
      - spec=${{ inputs.spec }}
    container:
      image: swr.cn-north-4.myhuaweicloud.com/ci_cann/${{ inputs.image_version }}
