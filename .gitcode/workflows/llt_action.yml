name: llt_action

# 无卡门禁用例（LLT）：不依赖 NPU 设备，PR 触发时全量执行。
#   1. ophost 侧 tiling 单元测试（googletest + ctest）
#   2. Triton 算子 CPU 回退精度测试（pytest）
#   3. Composite（纯 PyTorch）算子 CPU 精度测试（pytest）
#   4. Triton kernel 全分支 AOT 编译检查（triton-ascend 安装由流水线侧提供）

on:
  workflow_call:
    inputs:
      task_name:
        required: true
        type: string
      image_version:
        required: true
        type: string
      arch:
        required: false
        type: string
        default: 'x64'
      spec:
        required: false
        type: string
        default: 'large'

jobs:
  JOB_llt:
    name: LLT
    steps:
      -
        name: Checkout
        identifier: process_checkout
        uses: checkout
        with:
          ref: ${{ atomgit.event.pull_request.merge_commit_sha }}
          allow-unsafe-pr-checkout: true
      -
        name: ophost_ut
        run: |
          cd ${{ steps.process_checkout.outputs.path }}
          if sudo update-alternatives --set gcc /usr/bin/gcc-16 2>/dev/null; then
              echo "Switched to gcc-16"
          elif sudo update-alternatives --set gcc /usr/bin/gcc-15 2>/dev/null; then
              echo "Switched to gcc-15"
          elif sudo update-alternatives --set gcc /usr/bin/gcc-14 2>/dev/null; then
              echo "gcc-16/15 not available, fell back to gcc-14"
          fi

          if gcc --version | head -n1 | grep -q "15\."; then
              rm -rf /home/jenkins/opensource/lib_cache
              if [ -d /home/jenkins/opensource/gcc15 ]; then
                  rm -rf /home/jenkins/opensource/gcc15/lib_cache/abseil-cpp
                  rm -rf /home/jenkins/opensource/gcc15/lib_cache/device/abseil-cpp
                  ln -s /home/jenkins/opensource/gcc15/lib_cache/ /home/jenkins/opensource/lib_cache
              elif [ -d /home/jenkins/opensource/gcc15x86 ]; then
                  rm -rf /home/jenkins/opensource/gcc15x86/lib_cache/abseil-cpp
                  rm -rf /home/jenkins/opensource/gcc15x86/lib_cache/device/abseil-cpp
                  ln -s /home/jenkins/opensource/gcc15x86/lib_cache/ /home/jenkins/opensource/lib_cache
              fi
          elif gcc --version | head -n1 | grep -q "14\."; then
              gcc --version
          else
              gcc --version
              rm -rf /home/jenkins/opensource/lib_cache
              ln -s /home/jenkins/opensource/ubuntu20/lib_cache /home/jenkins/opensource/lib_cache
          fi
          source /home/jenkins/Ascend/cann/bin/setenv.bash
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j "$(nproc)"
          ctest --test-dir build --output-on-failure
      -
        name: triton_cpu_fallback_ut
        run: |
          cd ${{ steps.process_checkout.outputs.path }}
          if sudo update-alternatives --set gcc /usr/bin/gcc-16 2>/dev/null; then
              echo "Switched to gcc-16"
          elif sudo update-alternatives --set gcc /usr/bin/gcc-15 2>/dev/null; then
              echo "Switched to gcc-15"
          elif sudo update-alternatives --set gcc /usr/bin/gcc-14 2>/dev/null; then
              echo "gcc-16/15 not available, fell back to gcc-14"
          fi

          if gcc --version | head -n1 | grep -q "15\."; then
              rm -rf /home/jenkins/opensource/lib_cache
              if [ -d /home/jenkins/opensource/gcc15 ]; then
                  rm -rf /home/jenkins/opensource/gcc15/lib_cache/abseil-cpp
                  rm -rf /home/jenkins/opensource/gcc15/lib_cache/device/abseil-cpp
                  ln -s /home/jenkins/opensource/gcc15/lib_cache/ /home/jenkins/opensource/lib_cache
              elif [ -d /home/jenkins/opensource/gcc15x86 ]; then
                  rm -rf /home/jenkins/opensource/gcc15x86/lib_cache/abseil-cpp
                  rm -rf /home/jenkins/opensource/gcc15x86/lib_cache/device/abseil-cpp
                  ln -s /home/jenkins/opensource/gcc15x86/lib_cache/ /home/jenkins/opensource/lib_cache
              fi
          elif gcc --version | head -n1 | grep -q "14\."; then
              gcc --version
          else
              gcc --version
              rm -rf /home/jenkins/opensource/lib_cache
              ln -s /home/jenkins/opensource/ubuntu20/lib_cache /home/jenkins/opensource/lib_cache
          fi
          source /home/jenkins/Ascend/cann/bin/setenv.bash
          python3 -m pytest tests/triton -v
      -
        name: composite_cpu_ut
        run: |
          cd ${{ steps.process_checkout.outputs.path }}
          python3 -m pytest tests/composite -v
      -
        name: triton_aot_compile_check
        run: |
          cd ${{ steps.process_checkout.outputs.path }}
          if sudo update-alternatives --set gcc /usr/bin/gcc-16 2>/dev/null; then
              echo "Switched to gcc-16"
          elif sudo update-alternatives --set gcc /usr/bin/gcc-15 2>/dev/null; then
              echo "Switched to gcc-15"
          elif sudo update-alternatives --set gcc /usr/bin/gcc-14 2>/dev/null; then
              echo "gcc-16/15 not available, fell back to gcc-14"
          fi

          if gcc --version | head -n1 | grep -q "15\."; then
              rm -rf /home/jenkins/opensource/lib_cache
              if [ -d /home/jenkins/opensource/gcc15 ]; then
                  rm -rf /home/jenkins/opensource/gcc15/lib_cache/abseil-cpp
                  rm -rf /home/jenkins/opensource/gcc15/lib_cache/device/abseil-cpp
                  ln -s /home/jenkins/opensource/gcc15/lib_cache/ /home/jenkins/opensource/lib_cache
              elif [ -d /home/jenkins/opensource/gcc15x86 ]; then
                  rm -rf /home/jenkins/opensource/gcc15x86/lib_cache/abseil-cpp
                  rm -rf /home/jenkins/opensource/gcc15x86/lib_cache/device/abseil-cpp
                  ln -s /home/jenkins/opensource/gcc15x86/lib_cache/ /home/jenkins/opensource/lib_cache
              fi
          elif gcc --version | head -n1 | grep -q "14\."; then
              gcc --version
          else
              gcc --version
              rm -rf /home/jenkins/opensource/lib_cache
              ln -s /home/jenkins/opensource/ubuntu20/lib_cache /home/jenkins/opensource/lib_cache
          fi
          source /home/jenkins/Ascend/cann/bin/setenv.bash
          export PATH=/opt/buildtools/python-3.10.2/bin:$PATH
          python3 -m pip uninstall -y triton triton-ascend
          python3 -m pip install triton-ascend==3.2.1 --extra-index-url=https://mirrors.huaweicloud.com/ascend/repos/pypi
          python3 triton-ascend/tools/aot_compile_check.py
      -
        name: upload
        uses: obs-upload
        if: ${{ always() }}
        with:
          endpoint: "https://obs.cn-north-4.myhuaweicloud.com"
          bucket: "ascend-ci"
          access-key: ${{ secrets.AK }}
          secret-key: ${{ secrets.SK }}
          artifact-path: |
            ${{ steps.process_checkout.outputs.path }}/build/Testing/**
          object-prefix: ${{ env.obs_path }}/llt/
    if: "${{ default() }}"
    runs-on:
      - self-hosted
      - arch=${{ inputs.arch }}
      - spec=${{ inputs.spec }}
    container:
      image: swr.cn-north-4.myhuaweicloud.com/ci_cann/${{ inputs.image_version }}
